name: Build Desktop Application

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      release_name:
        description: 'Release Title Name'
        required: false
        default: 'Release'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: 1
      FLET_CLI_NO_RICH_OUTPUT: 1

    # Define the build matrix for both architectures
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: "TRT"
            req_file: "requirements/requirements_TRT.txt"
          - target: "TRT-RTX"
            req_file: "requirements/requirements_TRT-RTX.txt"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Maximize Windows Runner Disk Space
      shell: powershell
      run: |
        Write-Host "Disk space before cleanup:"
        Get-Volume

        # Remove Android SDKs ~12-15 GB
        if (Test-Path "$env:ANDROID_HOME") {
            Write-Host "Removing Android SDK..."
            Remove-Item -Recurse -Force "$env:ANDROID_HOME" -ErrorAction SilentlyContinue
        }

        # Clean up Windows Package Manager & Chocolatey Caches ~2-3 GB
        if (Test-Path "$env:ChocolateyInstall\cache") {
            Write-Host "Cleaning Chocolatey cache..."
            Remove-Item -Recurse -Force "$env:ChocolateyInstall\cache" -ErrorAction SilentlyContinue
        }

        Write-Host "Disk space after cleanup:"
        Get-Volume

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Visual Studio Build Tools
      uses: microsoft/setup-msbuild@v2

    - name: Install C++ Workload Dependencies
      shell: powershell
      run: |
        choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --passive --norestart" -y

    - name: Install Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.7'
        channel: 'stable'
        cache: true

    - name: Install System/Flet Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel "flet[cli]"

    - name: Download Pre-trained Models from Release
      shell: powershell
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        New-Item -ItemType Directory -Force -Path "src/assets"
        gh release download --repo AmusementClub/vs-mlrt --pattern "models.v15.16.7z" --dir src/assets

    - name: Extract Models into Assets Folder
      shell: powershell
      run: |
        7z x "src/assets/models.v15.16.7z" -o"src/assets/" -y
        Remove-Item -Path "src/assets/models.v15.16.7z" -Force

    - name: Update Version Configuration
      shell: powershell
      run: |
        $configPath = "pyproject.toml"
        $newVersion = "${{ github.event.inputs.version_tag }}"

        write-host "Targeting version bump to: $newVersion"

        if (Test-Path $configPath) {
            $content = Get-Content -Path $configPath -Raw
            $updatedContent = $content -replace 'version\s*=\s*"[^"]+"', "version = `"$newVersion`""
            [System.IO.File]::WriteAllText((Resolve-Path $configPath), $updatedContent, (New-Object System.Text.UTF8Encoding($false)))
            write-host "Successfully updated pyproject.toml version line without BOM!"
        } else {
            write-error "Error: pyproject.toml file not found!"
            exit 1
        }

    - name: Clean Up Unused Files
      shell: powershell
      run: |
        Remove-Item -Path "build" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path ".git" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path ".github" -Recurse -Force -ErrorAction SilentlyContinue

        pip cache purge
        choco cache list

        Remove-Item -Path "C:\ProgramData\chocolatey\cache" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "$env:USERPROFILE\AppData\Local\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -ErrorAction SilentlyContinue
        npm cache clean --force -ErrorAction SilentlyContinue

    - name: Package Application Executable
      run: |
        Copy-Item -Path "${{ matrix.req_file }}" -Destination "./requirements.txt" -Force
        flet build windows -v

    - name: Include License in Build Output
      shell: powershell
      run: |
        if (Test-Path "LICENSE") {
            Copy-Item -Path "LICENSE" -Destination "build/windows/" -Force
            echo "Successfully bundled LICENSE into the build folder!"
        } else {
            echo "Warning: LICENSE file not found in repository root."
        }

    - name: Compress Build Into Architecture-Specific Multi-Part Volumes
      shell: powershell
      run: |
        7z a -v2000m Just_A_Video_Tool-Windows-${{ matrix.target }}.zip .\build\windows\* -y

    - name: Create GitHub Release and Upload Split Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version_tag }}
        name: "${{ github.event.inputs.release_name }} (${{ github.event.inputs.version_tag }})"
        draft: true
        prerelease: false
        files: |
          Just_A_Video_Tool-Windows-${{ matrix.target }}.zip.*
        body: |
          ### 📦 Application Installation Instructions (Multi-Part Download)

          Because these standalone packages bundle local GPU runtimes and AI models, they have been split into 2GB volumes to satisfy server limits.

          **How to install:**
          1. Choose either the **TRT** or **TRT-RTX** build variations based on your device profile.
          2. Download **all** attached file parts belonging to your variant (`.zip.001`, `.zip.002`, etc.) into the exact same folder on your PC.
          3. Right-click the **first** file (e.g., `Just_A_Video_Tool-Windows-VERSION_YOU_NEED.zip.001`).
          4. Select **7-Zip** or **WinRAR** -> **Extract**. The utility software will automatically merge all matching parts and extract your full unified application!

          ---

          ## What version should I choose ?
          If you have an RTX series, go for the **TRT-RTX** version.
          If you have other series, go for the **TRT** version.

          GPUs older than the RTX 20 series or non Nvidia are currently not supported.

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
